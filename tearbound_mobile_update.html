(()=>{'use strict';

['MOM\'S TEAR','Tears travel faster.',p=>p.shotSpeed+=2],['POLYPHEMUS','Huge, heavy tears.',p=>{p.damage+=2.1;p.fireRate*=1.25;p.bulletSize+=3}],['SAD ONION','Tear rate up.',p=>p.fireRate=Math.max(8,p.fireRate-5)],['SACRED HEART','A blessed damage boost.',p=>{p.damage+=1.4;p.homing=true}],['CRICKETS HEAD','Damage and tear size up.',p=>{p.damage+=1;p.bulletSize+=2}],['PENTAGRAM','Dark power rises.',p=>p.damage+=1.2],['MUTANT SPIDER','More tears at once.',p=>p.multiShot=3],['BRIMSTONE','Charge a piercing beam.',p=>p.brimstone=true],['THE WAFER','Incoming damage is softened.',p=>p.armor=true],['SPOON BENDER','Your tears seek enemies.',p=>p.homing=true],['MONEY = POWER','Coins add a little damage.',p=>p.coinPower=true],['INNER EYE','Triple shot, slower rate.',p=>{p.multiShot=3;p.fireRate+=8}],['CRICKETS BODY','Tears split on impact.',p=>p.split=true],['MOMS KNIFE','A returning blade.',p=>p.knife=true],['CUPIDS ARROW','Tears pierce foes.',p=>p.piercing=true],['GUPPYS PAW','A mysterious extra heart.',p=>p.maxHp+=1]
];

let state='menu',player=null,rooms={},current={x:2,y:2},floor=0,keys={},mouse={x:480,y:300,down:false},shots=[],foeShots=[],enemies=[],particles=[],pickups=[],decor=[],mapOpen=false,selected=0,frame=0,last=0,shake=0,toast='',toastTime=0,shopBought=false,runStats={kills:0,items:0},audio=null,musicTimer=0;

let musicClock=null,musicStep=0;function startMusic(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(musicClock)clearInterval(musicClock);if(!settings.musicOn||settings.music<=0)return;const scale=[0,3,5,7,10,12,10,7,5,3,2,5];musicClock=setInterval(()=>{if(state!=='play'||!audio)return;let n=scale[musicStep++%scale.length],base=55*Math.pow(2,floor/12),o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=base*Math.pow(2,n/12);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.012*settings.music*settings.volume,audio.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.8);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.85)},430)}catch(e){}}
function newPlayer(id){let c=chars[id];return{x:480,y:300,r:13,speed:c[2],hp:c[3],maxHp:c[3],damage:3.5*c[4],fireRate:19,shotSpeed:7.5,bulletSize:5,multiShot:1,homing:false,piercing:false,split:false,brimstone:id===4,knife:false,armor:false,coinPower:false,coins:0,bombs:1,keys:1,charge:0,chargeReady:false,beam:null,invuln:0,character:id,face:0,walk:0,items:[],lucky:id===2?2:0,secondChance:id===8,redKey:false}}

function makeFloor(){rooms={};let coords=[];for(let y=0;y<5;y++)for(let x=0;x<5;x++){if(Math.random()>.22||x===2&&y===2)coords.push({x,y})}coords.push({x:2,y:2});let seen=new Set(['2,2']),queue=[{x:2,y:2}];while(queue.length){let a=queue.shift();for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=a.x+d[0],ny=a.y+d[1],k=roomKey(nx,ny);if(coords.some(c=>c.x===nx&&c.y===ny)&&!seen.has(k)){seen.add(k);queue.push({x:nx,y:ny})}}}coords=coords.filter(c=>seen.has(roomKey(c.x,c.y)));let specials=['treasure','shop','boss','secret','deal'];let used=new Set(['2,2']);let boss=choice(coords.filter(c=>c.x===2&&c.y===0||c.x===2&&c.y===4||c.x===0&&c.y===2||c.x===4&&c.y===2))||coords[coords.length-1];
for(let c of coords){let k=roomKey(c.x,c.y),type='normal';if(k===roomKey(boss.x,boss.y))type='boss';else if(Math.random()<.12)type='treasure';else if(Math.random()<.09)type='shop';else if(Math.random()<.07)type='deal';else if(Math.random()<.08)type='curse';rooms[k]={...c,type,visited:false,cleared:false,seed:Math.random(),item:null}}current={x:2,y:2};rooms['2,2'].visited=true;enterRoom(true);}
function enterRoom(first=false){let r=rooms[roomKey(current.x,current.y)];if(!r)return;r.visited=true;shots=[];foeShots=[];enemies=[];pickups=[];particles=[];player.x=480;player.y=300;if(!r.cleared){if(r.type==='boss')spawnBoss();else if(r.type==='treasure'){if(!r.item)r.item=choice(itemDefs);pickups.push({x:480,y:270,type:'item',item:r.item,spin:0})}else if(r.type==='shop'){if(!r.item)r.item=choice(itemDefs);pickups.push({x:480,y:275,type:'shopitem',item:r.item,spin:0});pickups.push({x:390,y:330,type:'coin',value:5});}else if(r.type==='deal'){if(!r.item)r.item=choice(itemDefs);pickups.push({x:480,y:275,type:'dealitem',item:r.item,spin:0})}else if(r.type==='curse'){spawnWave(2+floor)}else if(r.type==='normal'){spawnWave(ri(1,3)+Math.floor(floor*.5))}}}
function spawnWave(n){for(let i=0;i<n;i++){let t=choice(['chaser','fly','spitter','hopper']);let a=rand(0,Math.PI*2),rad=rand(170,290);enemies.push({type:t,x:480+Math.cos(a)*rad,y:300+Math.sin(a)*rad,hp:(t==='spitter'?16:12)+floor*3,max:(t==='spitter'?16:12)+floor*3,r:t==='fly'?10:14,speed:t==='fly'?1.35:t==='hopper'?0.92:0.78,damage:1,phase:rand(0,6),cool:rand(40,100),hit:0})}}
function spawnBoss(){let b=floors[floor].boss;enemies.push({type:'boss',name:b,x:480,y:190,hp:180+floor*70,max:180+floor*70,r:39,speed:.72+floor*.055,damage:1,phase:0,cool:80,hit:0});say(b+' approaches!')}
function getDoors(){let out=[];for(let [dx,dy,side] of [[0,-1,'top'],[0,1,'bottom'],[-1,0,'left'],[1,0,'right']])if(rooms[roomKey(current.x+dx,current.y+dy)])out.push({dx,dy,side});return out}
function transition(d){let r=rooms[roomKey(current.x+d.dx,current.y+d.dy)];if(!r)return;current.x+=d.dx;current.y+=d.dy;enterRoom();sound(140,.12,'triangle')}

function pickup(p){if(p.type==='item'||p.type==='shopitem'||p.type==='dealitem'){if(p.type==='shopitem'&&player.coins<5){say('Need 5 coins!');return}if(p.type==='shopitem')player.coins-=5;if(p.type==='dealitem'&&player.hp<2){say('Not enough hearts to trade!');return}if(p.type==='dealitem')player.hp=Math.max(1,player.hp-1);applyItem(p.item);p.gone=true}else if(p.type==='coin'){player.coins+=p.value||1;p.gone=true;sound(700,.07,'square')}else if(p.type==='heart'){player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true}else if(p.type==='bomb'){player.bombs++;p.gone=true}else if(p.type==='key'){player.keys++;p.gone=true}}
function fire(){if(player.character===4||player.brimstone){player.charge=(player.charge||0)+1;if(player.charge>=34&&!player.beam&&player.cool<=0){let dx=mouse.x-player.x,dy=mouse.y-player.y,a=Math.atan2(dy,dx);player.face=a;player.beam={angle:a,life:19,tick:0};player.cool=48;player.charge=0;sound(95,.28,'sawtooth',.055);for(let i=0;i<12;i++)particles.push({x:player.x+Math.cos(a)*rand(18,75),y:player.y+Math.sin(a)*rand(18,75),vx:rand(-1,1),vy:rand(-1,1),life:rand(8,18),r:rand(2,6),color:'#d8b4ff'})}return}if(player.cool>0)return;player.cool=player.fireRate;let dx=mouse.x-player.x,dy=mouse.y-player.y,a=Math.atan2(dy,dx);player.face=a;let count=player.multiShot;for(let i=0;i<count;i++){let ang=a+(i-(count-1)/2)*.16;shots.push({x:player.x+Math.cos(ang)*17,y:player.y+Math.sin(ang)*17,vx:Math.cos(ang)*player.shotSpeed,vy:Math.sin(ang)*player.shotSpeed,r:player.bulletSize,damage:player.damage+(player.coinPower?player.coins*.025:0),life:90,pierce:player.piercing,hit:[]})}sound(340,.045,'triangle',.025)}
function hurt(e,dmg){e.hp-=dmg;e.hit=7;for(let i=0;i<5;i++)particles.push({x:e.x,y:e.y,vx:rand(-2,2),vy:rand(-2,2),life:18,r:rand(2,4),color:'#e7c3a0'});if(e.hp<=0){runStats.kills++;if(e.type==='boss'){let r=rooms[roomKey(current.x,current.y)];r.cleared=true;pickups.push({x:480,y:300,type:'heart'});pickups.push({x:440,y:330,type:'key'});say('Boss defeated! Find the hatch.')}else if(Math.random()<.23)pickups.push({x:e.x,y:e.y,type:Math.random()<.65?'coin':'heart',value:1});sound(100,.12,'sawtooth') }}
function damagePlayer(){if(player.invuln>0)return;if(player.armor&&Math.random()<.5){say('The Wafer softened the hit!');player.invuln=35;return}player.hp--;player.invuln=75;shake=10;sound(90,.2,'sawtooth');if(player.hp<=0){if(player.secondChance){player.secondChance=false;player.hp=2;player.maxHp=Math.max(player.maxHp,2);say('Second chance!');}else{state='dead';showDead()}}}
function update(dt){if(state!=='play')return;frame++;let r=rooms[roomKey(current.x,current.y)];player.cool=Math.max(0,(player.cool||0)-dt);player.invuln=Math.max(0,player.invuln-dt);player.walk+=dt;let vx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),vy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);let l=Math.hypot(vx,vy)||1;let nx=player.x+vx/l*player.speed*dt,ny=player.y+vy/l*player.speed*dt;if(vx||vy)player.face=Math.atan2(vy,vx);let doors=getDoors(),open=r.cleared;let passTop=open&&doors.some(d=>d.side==='top')&&Math.abs(nx-480)<43,passBottom=open&&doors.some(d=>d.side==='bottom')&&Math.abs(nx-480)<43,passLeft=open&&doors.some(d=>d.side==='left')&&Math.abs(ny-300)<43,passRight=open&&doors.some(d=>d.side==='right')&&Math.abs(ny-300)<43;player.x=clamp(nx,ROOM.x+13,ROOM.x+ROOM.w-13);player.y=clamp(ny,ROOM.y+13,ROOM.y+ROOM.h-13);if(!passTop&&player.y<ROOM.y+22)player.y=ROOM.y+22;if(!passBottom&&player.y>ROOM.y+ROOM.h-22)player.y=ROOM.y+ROOM.h-22;if(!passLeft&&player.x<ROOM.x+22)player.x=ROOM.x+22;if(!passRight&&player.x>ROOM.x+ROOM.w-22)player.x=ROOM.x+ROOM.w-22;
if(mouse.down||keys.Space)fire();else if(player.character===4)player.charge=0;if(player.beam){player.beam.life-=dt;player.beam.tick-=dt;if(player.beam.tick<=0){player.beam.tick=4;let a=player.beam.angle;for(let e of enemies){let dx=e.x-player.x,dy=e.y-player.y,along=dx*Math.cos(a)+dy*Math.sin(a),side=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));if(along>0&&along<300&&side<19+e.r)hurt(e,player.damage*.42)}}if(player.beam.life<=0)player.beam=null}for(let d of doors){let x=480,y=300;if(d.side==='top')y=ROOM.y+13;if(d.side==='bottom')y=ROOM.y+ROOM.h-13;if(d.side==='left')x=ROOM.x+13;if(d.side==='right')x=ROOM.x+ROOM.w-13;if(r.cleared&&Math.hypot(player.x-x,player.y-y)<27){transition(d);break}}

stickBase.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stickBase.setPointerCapture(e.pointerId);stickMove(e)});stickBase.addEventListener('pointermove',stickMove);function releaseStick(e){if(stickId!==e.pointerId)return;stickId=null;stickKnob.style.transform='';keys.w=keys.a=keys.s=keys.d=false}stickBase.addEventListener('pointerup',releaseStick);stickBase.addEventListener('pointercancel',releaseStick);
function bindFire(id,dx,dy){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);mouse.x=player?player.x+dx*300:480+dx*300;mouse.y=player?player.y+dy*300:300+dy*300;mouse.down=true;b.dataset.pressed='1'});let up=e=>{mouse.down=false;b.dataset.pressed='0'};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)}bindFire('fireUp',0,-1);bindFire('fireDown',0,1);bindFire('fireLeft',-1,0);bindFire('fireRight',1,0);document.getElementById('mapBtn').addEventListener('click',()=>{mapOpen=!mapOpen});document.getElementById('pauseBtn').addEventListener('click',()=>{if(state==='play')showPause();else if(state==='pause'){state='play';overlay.classList.add('hidden')}});
document.body.classList.toggle('mobile-disabled',!settings.mobileOn);showMenu();requestAnimationFrame(loop);
window.addEventListener('error',e=>{overlay.classList.remove('hidden');menu.innerHTML='<div class="logo" style="font-size:34px">TEARBOUND ERROR</div><p class="muted">The game hit a startup error. Reload this page. If it happens again, send the error details to the developer.</p><p class="muted" style="overflow-wrap:anywhere">'+String(e.message||'Unknown error').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});
})();
</script></body></html>
